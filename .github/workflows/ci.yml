name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, types & format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Check formatting (Biome)
        if: ${{ !cancelled() }}
        run: npm run format:check

  build:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export + resume PDFs)
        # The runner image ships Google Chrome; the PDF generator picks it up
        # via CHROME_PATH. --no-sandbox: the ephemeral runner renders only our
        # own freshly built pages.
        run: CHROME_PATH="${CHROME_BIN:-/usr/bin/google-chrome}" CHROME_ARGS=--no-sandbox npm run build:resume

      - name: Smoke test (serve + assert routes, PDFs, clean URLs)
        run: npm run test:smoke
